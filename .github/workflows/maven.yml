
name: Selenium DevOps Lab

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      selenium:
        image: selenium/standalone-chrome:4.27.0
        ports:
          - 4444:4444
        options: >-
          --shm-size=2gb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Wait for Selenium
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4444/status; then
              echo "Selenium is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Selenium did not start"
          exit 1

      - name: Build and test with Maven
        run: mvn clean test
        env:
          SELENIUM_URL: http://localhost:4444/wd/hub
